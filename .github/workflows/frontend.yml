name: Frontend and integration checks

on: workflow_call

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Start the production images on a private network
        run: docker compose up --build -d web-ci

      - name: Check the frontend bundle and problem documentation
        run: sh frontend/smoke-test.sh http://127.0.0.1:8181

      - name: Run browser and shared contract tests through the frontend
        env:
          CALCULATOR_URL: http://127.0.0.1:8181
          HUSKY: '0'
        run: |
          npm ci --prefix frontend
          npm --prefix frontend run test:browser

      - name: Stop test containers
        if: always()
        run: docker compose --profile verify down
