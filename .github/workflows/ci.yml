name: Calculator CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test the Docker image
        run: docker compose up --build --exit-code-from verify

      - name: Collect the OpenAPI spec and generated Postman requests
        run: docker compose cp verify:/work/postman ./postman-contract

      - uses: actions/upload-artifact@v6
        with:
          name: postman-contract
          path: postman-contract/
          include-hidden-files: true
          if-no-files-found: error

      - name: Stop test containers
        if: always()
        run: docker compose down

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    environment: production
    concurrency:
      group: railway-production
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the Railway CLI
        run: npm install --prefix "$RUNNER_TEMP/railway-cli" @railway/cli@5.75.0

      - name: Deploy the verified commit to Railway
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          latest=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$latest" != "$GITHUB_SHA" ]; then
            echo "A newer commit is on main. Skipping this deployment."
            exit 0
          fi

          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "::error::Set RAILWAY_TOKEN to the Railway production project token."
            exit 1
          fi

          "$RUNNER_TEMP/railway-cli/node_modules/.bin/railway" up --ci --json \
            --project a474cdf0-ca6f-405e-a962-f8d60ea92f72 \
            --environment production --service calculator-api \
            --message "GitHub Actions $GITHUB_SHA" | tee "$RUNNER_TEMP/railway-deploy.jsonl"
          jq --exit-status --slurp 'any(.[]; .status? == "success")' "$RUNNER_TEMP/railway-deploy.jsonl"
