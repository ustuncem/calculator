name: Backend CI

on:
  pull_request:
    paths: ['backend/**']
  push:
    branches: [main]
    paths: ['backend/**']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test the Docker image
        run: docker compose up --build --exit-code-from verify verify

      - name: Collect the OpenAPI spec and generated Postman requests
        run: docker compose --profile verify cp verify:/work/postman ./postman-contract

      - uses: actions/upload-artifact@v6
        with:
          name: postman-contract
          path: postman-contract/
          include-hidden-files: true
          if-no-files-found: error

      - name: Stop test containers
        if: always()
        run: docker compose --profile verify down

  deploy:
    if: github.event_name == 'push'
    needs: verify
    uses: ./.github/workflows/deploy.yml
    with:
      directory: backend
      service: calculator-api
    secrets: inherit
