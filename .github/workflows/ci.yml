name: Calculator CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test the Docker image
        run: docker compose up --build --exit-code-from verify

      - name: Collect the OpenAPI spec and generated Postman requests
        run: docker compose cp verify:/work/postman ./postman-contract

      - uses: actions/upload-artifact@v6
        with:
          name: postman-contract
          path: postman-contract/
          include-hidden-files: true
          if-no-files-found: error

      - name: Stop test containers
        if: always()
        run: docker compose down

  promote:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Advance the Railway deployment branch
        run: |
          if ! git push origin HEAD:refs/heads/production; then
            # A newer successful run may already have promoted this commit.
            git fetch origin production
            git merge-base --is-ancestor HEAD FETCH_HEAD
          fi
