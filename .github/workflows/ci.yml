name: Calculator CI

on:
  pull_request:
    paths: ['backend/**', 'frontend/**', 'postman/**', 'compose.yaml', '.github/workflows/**']
  push:
    branches: [main]
    paths: ['backend/**', 'frontend/**', 'postman/**', 'compose.yaml', '.github/workflows/**']

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      frontend: ${{ steps.paths.outputs.frontend }}
      contract: ${{ steps.paths.outputs.contract }}
      browser: ${{ steps.paths.outputs.browser }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ "$BASE" =~ ^0+$ ]]; then
            BASE=$(git mktree </dev/null)
          fi
          git diff --no-renames --name-only "$BASE" HEAD > "$RUNNER_TEMP/changed-files"
          changed() {
            if grep -Eq "$2" "$RUNNER_TEMP/changed-files"; then
              echo "$1=true"
            else
              echo "$1=false"
            fi
          }
          {
            changed backend '^backend/'
            changed frontend '^frontend/'
            changed contract '^(backend/|postman/|compose\.yaml$|\.github/workflows/)'
            changed browser '^(backend/|frontend/|compose\.yaml$|\.github/workflows/)'
          } >> "$GITHUB_OUTPUT"

  contract:
    needs: changes
    if: needs.changes.outputs.contract == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build and test the Docker image
        run: docker compose up --build --exit-code-from verify verify

      - name: Collect the OpenAPI spec and generated Postman requests
        run: docker compose --profile verify cp verify:/work/postman ./postman-contract

      - uses: actions/upload-artifact@v6
        with:
          name: postman-contract
          path: postman-contract/
          include-hidden-files: true
          if-no-files-found: error

      - name: Stop test containers
        if: always()
        run: docker compose --profile verify down

  browser:
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    uses: ./.github/workflows/frontend.yml

  deploy-backend:
    needs: [changes, contract, browser]
    if: github.event_name == 'push' && needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      directory: backend
      service: calculator-api
    secrets: inherit

  deploy-frontend:
    needs: [changes, browser]
    if: github.event_name == 'push' && needs.changes.outputs.frontend == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      directory: frontend
      service: calculator-web
    secrets: inherit
