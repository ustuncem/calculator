services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8080:8080"

  web:
    build: ./frontend
    environment:
      API_URL: http://api:8080
    ports:
      - "127.0.0.1:3000:8080"

  verify:
    build: ./postman
    depends_on:
      - api
    environment:
      API_URL: http://api:8080
